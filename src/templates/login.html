<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в аккаунт</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .login-container {
            width: 100%;
            max-width: 450px;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            padding: 40px;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo i {
            font-size: 50px;
            color: #667eea;
            margin-bottom: 15px;
        }
        
        .logo h1 {
            color: #333;
            font-size: 28px;
        }
        
        .logo p {
            color: #666;
            margin-top: 5px;
            font-size: 15px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        
        .input-with-icon {
            position: relative;
        }
        
        .input-with-icon i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #777;
        }
        
        input {
            width: 100%;
            padding: 15px 15px 15px 45px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.2);
            outline: none;
        }
        
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #777;
            cursor: pointer;
        }
        
        .error-message {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        
        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        
        .remember {
            display: flex;
            align-items: center;
        }
        
        .remember input {
            width: auto;
            margin-right: 8px;
        }
        
        .remember label {
            margin-bottom: 0;
            font-size: 14px;
            color: #555;
        }
        
        .forgot-password {
            font-size: 14px;
        }
        
        .forgot-password a {
            color: #667eea;
            text-decoration: none;
        }
        
        .forgot-password a:hover {
            text-decoration: underline;
        }
        
        .btn {
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 25px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 14px rgba(102, 126, 234, 0.3);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .social-login {
            text-align: center;
            margin-bottom: 25px;
        }
        
        .social-login p {
            color: #666;
            margin-bottom: 15px;
            font-size: 14px;
            position: relative;
        }
        
        .social-login p::before,
        .social-login p::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 30%;
            height: 1px;
            background-color: #eee;
        }
        
        .social-login p::before {
            left: 0;
        }
        
        .social-login p::after {
            right: 0;
        }
        
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        
        .social-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .social-icon:hover {
            transform: translateY(-3px);
        }
        
        .facebook {
            background-color: #3b5998;
        }
        
        .google {
            background-color: #dd4b39;
        }
        
        .twitter {
            background-color: #1da1f2;
        }
        
        .register-link {
            text-align: center;
            color: #666;
            font-size: 15px;
        }
        
        .register-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }
        
        .register-link a:hover {
            text-decoration: underline;
        }
        
        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
            }
            
            .remember-forgot {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <i class="fas fa-user-circle"></i>
            <h1>Вход в аккаунт</h1>
            <p>Введите ваши данные для входа</p>
        </div>
        
        <form id="loginForm" action="{{ url_for('user_login') }}" method="post">
            <div class="form-group">
                <label for="email">Электронная почта</label>
                <div class="input-with-icon">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" name="email" maxlength="255" autocomplete="username" placeholder="example@mail.com" required>
                </div>
                <div class="error-message" id="emailError">Пожалуйста, введите корректный email</div>
            </div>
            
            <div class="form-group">
                <label for="password">Пароль</label>
                <div class="input-with-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" name="password" maxlength="1024" autocomplete="current-password" placeholder="Введите пароль" required>
                    <span class="password-toggle" id="togglePassword">
                        <i class="fas fa-eye"></i>
                    </span>
                </div>
                <div class="error-message" id="passwordError">Пожалуйста, введите пароль</div>
            </div>
            
            <div class="remember-forgot">
                <div class="remember">
                    <input type="checkbox" id="remember">
                    <label for="remember">Запомнить меня</label>
                </div>
                <div class="forgot-password">
                    <a href="#" id="forgotPasswordLink">Забыли пароль?</a>
                </div>
            </div>
            
            <div class="error-message" id="loginError" role="alert"></div>
            <button type="submit" class="btn">Войти</button>
            
            <div class="social-login">
                <p>Или войдите через</p>
                <div class="social-icons">
                    <div class="social-icon facebook">
                        <i class="fab fa-facebook-f"></i>
                    </div>
                    <div class="social-icon google">
                        <i class="fab fa-google"></i>
                    </div>
                    <div class="social-icon twitter">
                        <i class="fab fa-twitter"></i>
                    </div>
                </div>
            </div>
            
            <div class="register-link">
                Нет аккаунта? <a href="{{ url_for('registration') }}" id="registerLink">Зарегистрироваться</a>
            </div>
        </form>
        
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const togglePassword = document.getElementById('togglePassword');
            const passwordField = document.getElementById('password');
            const emailField = document.getElementById('email');
            const loginForm = document.getElementById('loginForm');
            const loginError = document.getElementById('loginError');

            togglePassword.addEventListener('click', function() {
                passwordField.type = passwordField.type === 'password' ? 'text' : 'password';
                this.querySelector('i').classList.toggle('fa-eye');
                this.querySelector('i').classList.toggle('fa-eye-slash');
            });

            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                resetErrors();

                const email = emailField.value.trim();
                const password = passwordField.value;
                const remember = document.getElementById('remember').checked;
                let isValid = true;

                if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                    showError('emailError');
                    isValid = false;
                }
                if (password.length < 1) {
                    showError('passwordError');
                    isValid = false;
                }
                if (!isValid) {
                    return;
                }

                const button = loginForm.querySelector('button[type="submit"]');
                button.disabled = true;
                try {
                    const response = await fetch(loginForm.action, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({email, password})
                    });
                    const data = await response.json();
                    if (!response.ok) {
                        loginError.textContent = data.error || 'Не удалось выполнить вход.';
                        showError('loginError');
                        return;
                    }

                    // Запоминаем только email, но не пароль или его хэш.
                    if (remember) {
                        localStorage.setItem('rememberedEmail', email);
                    } else {
                        localStorage.removeItem('rememberedEmail');
                    }
                    passwordField.value = '';
                    alert('Успешный вход!');
                } catch (error) {
                    loginError.textContent = 'Не удалось выполнить вход. Попробуйте позже.';
                    showError('loginError');
                } finally {
                    button.disabled = false;
                }
            });

            const rememberedEmail = localStorage.getItem('rememberedEmail');
            if (rememberedEmail) {
                emailField.value = rememberedEmail;
                document.getElementById('remember').checked = true;
            }

            document.getElementById('forgotPasswordLink').addEventListener('click', function(e) {
                e.preventDefault();
                alert('Восстановление пароля пока не настроено.');
            });

            document.querySelectorAll('.social-icon').forEach(icon => {
                icon.addEventListener('click', function() {
                    alert('Вход через социальные сети пока не настроен.');
                });
            });

            function showError(errorId) {
                document.getElementById(errorId).style.display = 'block';
            }

            function resetErrors() {
                document.querySelectorAll('.error-message').forEach(element => {
                    element.style.display = 'none';
                });
            }

            [emailField, passwordField].forEach(input => {
                input.addEventListener('input', resetErrors);
            });
        });
    </script>
</body>
</html>
